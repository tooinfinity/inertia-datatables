name: tests

on:
  push:
    branches:
      - main
      - '*.x'
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: ./.github/actions/setup-node

      - name: Run frontend lint
        run: npm ci && npm run lint

      - name: Run frontend tests
        run: npm run typecheck && npm test

  tests:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        # Keep every PHP/Laravel pair on stable dependencies. Exercise the
        # lowest-dependency resolver at the oldest and newest compatibility
        # boundaries, plus one representative Windows environment.
        include:
          - os: ubuntu-latest
            php: 8.3
            laravel: 12.*
            testbench: 10.*
            stability: prefer-lowest
          - os: ubuntu-latest
            php: 8.3
            laravel: 12.*
            testbench: 10.*
            stability: prefer-stable
          - os: ubuntu-latest
            php: 8.3
            laravel: 13.*
            testbench: 11.*
            stability: prefer-stable
          - os: ubuntu-latest
            php: 8.4
            laravel: 12.*
            testbench: 10.*
            stability: prefer-stable
          - os: ubuntu-latest
            php: 8.4
            laravel: 13.*
            testbench: 11.*
            stability: prefer-stable
          - os: ubuntu-latest
            php: 8.5
            laravel: 12.*
            testbench: 10.*
            stability: prefer-stable
          - os: ubuntu-latest
            php: 8.5
            laravel: 13.*
            testbench: 11.*
            stability: prefer-stable
          - os: ubuntu-latest
            php: 8.5
            laravel: 13.*
            testbench: 11.*
            stability: prefer-lowest
          - os: windows-latest
            php: 8.4
            laravel: 13.*
            testbench: 11.*
            stability: prefer-stable

    name: P${{ matrix.php }} - L${{ matrix.laravel }} - ${{ matrix.stability }} - ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: ./.github/actions/setup-php
        with:
          php-version: ${{ matrix.php }}

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update --dev
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction --no-progress --no-scripts
          composer run prepare

      # Run repository-wide static checks once on the canonical Linux matrix
      # environment instead of reinstalling dependencies in a separate job.
      - name: Pint
        if: matrix.php == 8.4 && matrix.laravel == '13.*' && matrix.stability == 'prefer-stable' && runner.os == 'Linux'
        run: composer lint:check

      - name: PHPStan
        if: matrix.php == 8.4 && matrix.laravel == '13.*' && matrix.stability == 'prefer-stable' && runner.os == 'Linux'
        run: composer analyse

      - name: Rector
        if: matrix.php == 8.4 && matrix.laravel == '13.*' && matrix.stability == 'prefer-stable' && runner.os == 'Linux'
        run: composer rector:check

      - name: Test Suite
        if: runner.os != 'Windows'
        run: composer test:unit

      - name: Test Suite (Windows)
        if: runner.os == 'Windows'
        run: vendor/bin/pest

      - name: Test Suite (Type Coverage)
        if: matrix.php == 8.4 && matrix.laravel == '13.*' && matrix.stability == 'prefer-stable' && runner.os == 'Linux'
        shell: bash
        run: |
          set -o pipefail
          composer test:types | tee type-coverage.txt

      - name: Upload type coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && matrix.php == 8.4 && matrix.laravel == '13.*' && matrix.stability == 'prefer-stable' && runner.os == 'Linux'
        with:
          name: type-coverage-report-${{ matrix.os }}-${{ matrix.php }}-L${{ matrix.laravel == '12.*' && '12' || '13' }}-${{ matrix.stability }}
          path: type-coverage.txt

  databases:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - database: mysql
            image: mysql:8
            port: 3306
            username: root
            health_cmd: mysqladmin ping
          - database: pgsql
            image: postgres:16
            port: 5432
            username: postgres
            health_cmd: pg_isready -U postgres

    name: DB ${{ matrix.database }}

    services:
      database:
        image: ${{ matrix.image }}
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: inertia_datatables
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: inertia_datatables
        ports:
          - ${{ matrix.port }}:${{ matrix.port }}
        options: >-
          --health-cmd="${{ matrix.health_cmd }}"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DB_CONNECTION: ${{ matrix.database }}
      DB_HOST: 127.0.0.1
      DB_PORT: ${{ matrix.port }}
      DB_DATABASE: inertia_datatables
      DB_USERNAME: ${{ matrix.username }}
      DB_PASSWORD: ''

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: ./.github/actions/setup-php
        with:
          php-version: 8.4
          extensions: dom, curl, libxml, mbstring, zip, fileinfo, sqlite, pdo_sqlite, pdo_mysql, pdo_pgsql, bcmath, intl

      - name: Install dependencies
        run: |
          composer update --prefer-stable --prefer-dist --no-interaction --no-progress --no-scripts
          composer run prepare

      - name: Test Suite
        run: composer test:unit
