name: Registry

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify registry artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate registry
        run: npm run registry:validate

      - name: Verify consumer installation resolution
        run: npm run registry:verify-consumer

      - name: Rebuild registry artifacts
        run: npm run registry:build

      - name: Verify generated artifacts are up to date
        run: |
          git diff --exit-code public/r
          test -z "$(git ls-files --others --exclude-standard -- public/r)"
