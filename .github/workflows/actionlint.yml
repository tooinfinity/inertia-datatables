name: actionlint

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    name: Validate GitHub Actions configuration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download actionlint
        shell: bash
        run: |
          # Pin actionlint to a specific release via the official download script.
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) 1.7.12 "$RUNNER_TEMP"
          echo "$RUNNER_TEMP" >> $GITHUB_PATH

      - name: Lint workflows
        run: |
          # Validate every workflow YAML file under .github/workflows/ (the
          # default location actionlint scans when no path is given). Composite
          # action metadata (.github/actions/) is not a workflow and is not
          # passed to actionlint. shellcheck/pyflakes are explicitly disabled
          # so behavior is identical whether or not they are installed on the
          # runner.
          actionlint -no-color --shellcheck '' --pyflakes ''
