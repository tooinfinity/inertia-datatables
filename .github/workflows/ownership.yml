name: shadcn ownership

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, labeled]
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ---------------------------------------------------------------------------
# Authorization mechanism for protected-component maintenance PRs
# ---------------------------------------------------------------------------
# Ordinary PRs:
#   The `authorize-maintenance` job is skipped (label absent or not a PR).
#   The `enforce-ownership` job runs with no MAINTENANCE_AUTHORIZED env var.
#   protected-paths.js detects protected-path changes → fails (exit 1).
#
# Maintenance PRs (label "maintenance: protected-component"):
#   The `authorize-maintenance` job runs in the `protected-maintenance`
#   GitHub Environment. That environment MUST be configured by an administrator
#   with required reviewers. GitHub blocks the job until an eligible reviewer
#   approves the deployment. Only after explicit approval does the job run and
#   set MAINTENANCE_AUTHORIZED=true along with the approving actor and timestamp.
#   The `enforce-ownership` job reads those outputs via the needs context and
#   passes them to protected-paths.js as environment variables.
#   protected-paths.js calls check-maintenance-authorization.js to verify the
#   metadata and logs an audit entry. Only if all three fields are present and
#   correct does the protected-path check pass for the authorized change.
#
# Security properties:
#   - A label alone is never sufficient; it only routes to the environment gate.
#   - The environment's required-reviewer gate is enforced by GitHub; a job that
#     has not passed through the environment cannot set MAINTENANCE_AUTHORIZED.
#   - Fail-closed: any missing or malformed authorization metadata exits 1.
#   - Every authorization decision is recorded in the workflow log.
#   - Unauthorized actors cannot self-authorize: the environment gates who can
#     approve the deployment to run.
#
# IMPORTANT — administrator prerequisite:
#   Create a GitHub Actions Environment named exactly `protected-maintenance`
#   on this repository and add at least one required reviewer who is not the
#   PR author. Enable Prevent self-review.
#   See docs/architecture/shadcn-component-ownership.md for full setup.

jobs:
  # ---------------------------------------------------------------------------
  # Gate: runs only when the maintenance routing label is present on a PR.
  # Deploys to the protected-maintenance environment, which MUST be configured
  # with required reviewers by a repository administrator.
  # ---------------------------------------------------------------------------
  authorize-maintenance:
    name: Authorize protected-component maintenance
    if: >-
      github.event_name == 'pull_request' &&
      contains(github.event.pull_request.labels.*.name, 'maintenance: protected-component')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: protected-maintenance   # MUST have required reviewers configured
    permissions:
      actions: read

    outputs:
      authorized: ${{ steps.set-auth.outputs.authorized }}
      actor: ${{ steps.set-auth.outputs.actor }}
      timestamp: ${{ steps.set-auth.outputs.timestamp }}

    steps:
      - name: Record authorization
        id: set-auth
        env:
          GH_TOKEN: ${{ github.token }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          REVIEWS="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/approvals")"
          # Review history is scoped to the run, with no attempt or review timestamp.
          # Require an unambiguous reviewer rather than guessing the record order.
          if ! ACTOR="$(jq -er '
            [ .[] | select(.state == "approved" and any(.environments[]; .name == "protected-maintenance"))
              | .user.login ] | unique
            | select(length == 1) | .[0] | select(test("^[A-Za-z0-9][A-Za-z0-9-]*$"))
          ' <<< "$REVIEWS")"; then
            echo "::error::Expected an unambiguous approval from the protected-maintenance deployment review history."
            exit 1
          fi
          if [[ "${ACTOR,,}" == "${PR_AUTHOR,,}" ]]; then
            echo "::error::The PR author cannot approve protected-component maintenance."
            exit 1
          fi
          TIMESTAMP="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          echo "actor=${ACTOR}" >> "$GITHUB_OUTPUT"
          echo "timestamp=${TIMESTAMP}" >> "$GITHUB_OUTPUT"
          echo "authorized=true" >> "$GITHUB_OUTPUT"
          echo "Protected-component maintenance authorized by ${ACTOR}; recorded at ${TIMESTAMP}"
          echo "Environment: protected-maintenance (required reviewer gate passed)"

  # ---------------------------------------------------------------------------
  # Main check: validates CODEOWNERS, version consistency, and protected paths.
  # Reads authorization outputs from authorize-maintenance when it ran.
  # ---------------------------------------------------------------------------
  enforce-ownership:
    name: Enforce shadcn component ownership
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [authorize-maintenance]
    if: ${{ always() }}

    steps:
      - name: Require maintenance authorization to complete
        if: ${{ needs.authorize-maintenance.result == 'failure' || needs.authorize-maintenance.result == 'cancelled' }}
        run: |
          echo "::error::Protected-component maintenance authorization failed or was cancelled."
          exit 1

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '>=22.18.0 <23'
          package-manager-cache: false

      - name: Validate CODEOWNERS syntax and coverage
        run: node scripts/ci/validate-codeowners.js

      - name: Validate shadcn CLI version consistency
        run: node scripts/ci/check-shadcn-version.js

      - name: Detect protected compatibility shim changes
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
          # Set only when authorize-maintenance ran and produced a confirmed
          # authorization through the protected-maintenance environment gate.
          # For ordinary PRs these will be empty strings, which protected-paths.js
          # treats as unauthorized (fails closed).
          MAINTENANCE_AUTHORIZED: ${{ needs.authorize-maintenance.outputs.authorized }}
          MAINTENANCE_AUTHORIZED_BY: ${{ needs.authorize-maintenance.outputs.actor }}
          MAINTENANCE_AUTHORIZED_AT: ${{ needs.authorize-maintenance.outputs.timestamp }}
        run: |
          git fetch origin "$BASE_REF"
          MERGE_BASE=$(git merge-base HEAD "origin/$BASE_REF")
          git diff --name-status -z -M "$MERGE_BASE" HEAD | \
            node scripts/ci/protected-paths.js
