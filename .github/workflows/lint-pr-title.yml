name: Lint PR title

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR title
        uses: amannn/action-semantic-pull-request@v5
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            chore
            ci
            build
          requireScope: false
          allowReleases: false
          validationError: |
            Pull request titles must follow conventional commits format (e.g. `feat: ...`, `fix: ...`).
            Allowed types: feat, fix, docs, style, refactor, perf, test, chore, ci, build.
