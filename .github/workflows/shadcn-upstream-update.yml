name: shadcn upstream update

on:
  schedule:
    # Conservative weekly schedule: every Monday at 09:00 UTC. Override by
    # editing this cron; do not run more frequently than weekly.
    - cron: '0 9 * * 1'
  workflow_dispatch:

# Least privilege: only enough to create/update a branch and open a pull
# request. No PAT or GitHub App is required; see the workflow security notes
# in docs/architecture/shadcn-component-ownership.md.
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: shadcn-upstream-update
  cancel-in-progress: true

jobs:
  detect-and-propose:
    name: Detect upstream shadcn updates and propose a pull request
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Work from a dedicated, automation-owned branch that is always rebased
      # onto the default branch. Re-runs reuse the same branch so there is
      # never more than one update branch or pull request at a time.
      - name: Create update branch
        id: branch
        run: |
          git checkout -B "${UPDATE_BRANCH}" origin/${DEFAULT_BRANCH}
        env:
          UPDATE_BRANCH: ci/shadcn-upstream-update
          DEFAULT_BRANCH: main

      - name: Detect upstream changes and apply safe updates
        id: detect
        env:
          CI: "true"
          PROPOSAL_OUTPUT_FILE: "${{ runner.temp }}/shadcn-update-proposal.json"
          PR_TITLE_FILE: "${{ runner.temp }}/shadcn-pr-title.txt"
          PR_BODY_FILE: "${{ runner.temp }}/shadcn-pr-body.txt"
          UPDATE_BRANCH: ci/shadcn-upstream-update
          DEFAULT_BRANCH: main
        run: |
          status=0
          node scripts/ci/shadcn-upstream-update.js --apply || status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          # Exit 0 = no safely applicable changes (no pull request).
          # Exit 3 = safely applicable changes applied to the working tree.
          # Anything else = detection/validation failure; stop without pushing.
          if [ "$status" -eq 0 ]; then
            echo "No safely applicable upstream changes — no pull request will be created."
            exit 0
          fi
          if [ "$status" -ne 3 ]; then
            echo "::error::Upstream update detection failed with exit status $status."
            exit 1
          fi

      - name: Rebuild registry artifacts
        if: steps.detect.outputs.status == '3'
        run: |
          npm run registry:validate
          npm run registry:build

      - name: Commit proposed changes
        id: commit
        if: steps.detect.outputs.status == '3'
        run: |
          set -euo pipefail
          git add -A
          if git diff --cached --quiet; then
            echo "::error::Expected proposed upstream changes to be staged, but the index is empty."
            exit 1
          fi
          git -c user.name='github-actions[bot]' \
            -c user.email='github-actions[bot]@users.noreply.github.com' \
            commit -m "chore: propose shadcn/ui upstream update"
          commit_sha="$(git rev-parse HEAD)"
          echo "commit_sha=$commit_sha" >> "$GITHUB_OUTPUT"

      # Run the same mandatory checks that guard the default branch before the
      # pull request is proposed. Because PRs created with GITHUB_TOKEN do not
      # trigger pull_request workflows, all frontend and registry checks must
      # pass here before pushing.
      - name: Validate proposed changes
        if: steps.detect.outputs.status == '3'
        run: |
          set -euo pipefail
          npm test
          npm run lint
          npm run typecheck
          npm run registry:validate
          npm run registry:verify-consumer
          git diff --exit-code public/r
          test -z "$(git ls-files --others --exclude-standard -- public/r)"
          node scripts/ci/shadcn-compatibility-audit.js
          node scripts/ci/check-shadcn-version.js

      - name: Push update branch
        if: steps.detect.outputs.status == '3'
        env:
          UPDATE_BRANCH: ci/shadcn-upstream-update
          DEFAULT_BRANCH: main
          EXPECTED_COMMIT: ${{ steps.commit.outputs.commit_sha }}
        run: |
          set -euo pipefail
          head_sha="$(git rev-parse HEAD)"
          base_sha="$(git rev-parse "origin/${DEFAULT_BRANCH}")"
          if [ -z "${EXPECTED_COMMIT}" ] || [ "$head_sha" != "${EXPECTED_COMMIT}" ] || [ "$head_sha" = "$base_sha" ]; then
            echo "::error::Refusing to push: expected commit (${EXPECTED_COMMIT}) is missing or identical to origin/${DEFAULT_BRANCH}."
            exit 1
          fi
          git push -f origin "${UPDATE_BRANCH}"

      - name: Create or update pull request
        id: pr
        if: steps.detect.outputs.status == '3'
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATE_BRANCH: ci/shadcn-upstream-update
          DEFAULT_BRANCH: main
          PR_TITLE_FILE: "${{ runner.temp }}/shadcn-pr-title.txt"
          PR_BODY_FILE: "${{ runner.temp }}/shadcn-pr-body.txt"
        run: |
          set -euo pipefail

          # Duplicate prevention: if a pull request already exists from this
          # automation-owned branch, pushing the branch refreshes it. Never
          # create a second, competing update pull request.
          #
          # Do not suppress gh failures: an auth/API/network error must abort
          # the run rather than be mistaken for "no pull request exists", which
          # would lead to a duplicate creation attempt. A successful lookup that
          # returns nothing (existing empty) means no PR exists and it is safe
          # to create one.
          existing="$(gh pr list \
            --head "${UPDATE_BRANCH}" \
            --base "${DEFAULT_BRANCH}" \
            --state open \
            --json number \
            --jq '.[].number' | head -n 1)"

          pr_title="$(<"${PR_TITLE_FILE}")"

          if [ -n "$existing" ]; then
            gh pr edit "$existing" \
              --title "${pr_title}" \
              --body-file "${PR_BODY_FILE}"
            echo "Pull request #${existing} already open; updated title and body."
            echo "pr_number=$existing" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          gh pr create \
            --head "${UPDATE_BRANCH}" \
            --base "${DEFAULT_BRANCH}" \
            --title "${pr_title}" \
            --body-file "${PR_BODY_FILE}"

          pr_number="$(gh pr list \
            --head "${UPDATE_BRANCH}" \
            --base "${DEFAULT_BRANCH}" \
            --state open \
            --json number \
            --jq '.[].number' | head -n 1)"
          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"
          echo "Pull request #${pr_number} created from ${UPDATE_BRANCH}."

      # Route protected-component changes through the maintenance authorization
      # gate established by PR #146. This does not approve or merge anything;
      # it only signals that the pull request touches protected paths and
      # requires human reviewer approval via the protected-maintenance
      # environment before it can be merged.
      - name: Route protected changes to maintenance authorization
        if: steps.pr.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATE_PR_LABEL: "maintenance: protected-component"
          DEFAULT_BRANCH: main
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
        run: |
          set -euo pipefail
          if [ -z "${PR_NUMBER}" ]; then
            echo "::error::No pull request number available; cannot route protected changes."
            exit 1
          fi

          protected_changes="$(git diff --name-only "origin/${DEFAULT_BRANCH}..HEAD" -- registry/data-table/components/ui/)"
          if [ -z "$protected_changes" ]; then
            echo "No protected paths modified; maintenance label routing not required."
            exit 0
          fi

          labels="$(gh label list --search "${UPDATE_PR_LABEL}" --limit 100 --json name --jq '.[].name')"
          if ! printf '%s\n' "$labels" | grep -Fxq "${UPDATE_PR_LABEL}"; then
            echo "::error::Required label '${UPDATE_PR_LABEL}' does not exist; cannot route protected-component pull request #${PR_NUMBER} to maintenance authorization."
            exit 1
          fi

          gh pr edit "${PR_NUMBER}" --add-label "${UPDATE_PR_LABEL}"

          attached_labels="$(gh pr view "${PR_NUMBER}" --json labels --jq '.labels[].name')"
          if ! printf '%s\n' "$attached_labels" | grep -Fxq "${UPDATE_PR_LABEL}"; then
            echo "::error::Failed to verify that '${UPDATE_PR_LABEL}' is attached to pull request #${PR_NUMBER}."
            exit 1
          fi

          echo "Added and verified ${UPDATE_PR_LABEL} label on pull request #${PR_NUMBER}."
