name: release-verification

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release distribution
    runs-on: ubuntu-latest

    # Only reads release metadata and public distribution endpoints.
    # No publishing credentials are needed or exposed.
    steps:
      - name: Checkout code at release ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Verify GitHub release and tag
        run: |
          # Confirm the release tag matches the release and is not a draft/prerelease.
          TAG="${{ github.event.release.tag_name }}"
          RELEASE_ID="${{ github.event.release.id }}"
          echo "Verifying release $TAG (id $RELEASE_ID)"

          # Fetch the release via the GitHub API (authenticated with GITHUB_TOKEN).
          RESPONSE=$(curl -sSf \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases/$RELEASE_ID")

          PUBLISHED=$(printf '%s' "$RESPONSE" | node -e "
            let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{
              try{console.log(JSON.parse(d).published)}catch{e{process.exit(1)}}
            })
          ")
          DRAFT=$(printf '%s' "$RESPONSE" | node -e "
            let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{
              try{console.log(JSON.parse(d).draft)}catch{e{process.exit(1)}}
            })
          ")
          PRERELEASE=$(printf '%s' "$RESPONSE" | node -e "
            let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{
              try{console.log(JSON.parse(d).prerelease)}catch{e{process.exit(1)}}
            })
          })

          if [ "$PUBLISHED" != "true" ]; then
            echo "::error::Release is not published" && exit 1
          fi
          if [ "$DRAFT" != "false" ]; then
            echo "::error::Release is a draft" && exit 1
          fi
          if [ "$PRERELEASE" != "false" ]; then
            echo "::error::Release is a prerelease" && exit 1
          fi

          # Confirm the tag exists and points at the release target commit.
          TAG_REF=$(git rev-parse "$TAG^{}" 2>/dev/null || echo "")
          if [ -z "$TAG_REF" ]; then
            echo "::error::Tag $TAG does not exist" && exit 1
          fi
          echo "Tag $TAG resolved to $TAG_REF"

      - name: Verify Composer package distribution on Packagist
        run: |
          # Packagist auto-updates from GitHub tags; confirm the new version is listed.
          VERSION="${{ github.event.release.tag_name }}"
          echo "Verifying Packagist distribution for $VERSION"

          # Strip leading 'v' for Packagist version comparison.
          PKG_VERSION="${VERSION#v}"

          RESPONSE=$(curl -sSf "https://packagist.org/packages/tooinfinity/inertia-datatables.json")

          # List all versions and check ours is present.
          FOUND=$(printf '%s' "$RESPONSE" | node -e "
            let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{
              try{
                const pkg=JSON.parse(d);
                const versions=Object.keys(pkg.package.versions||{});
                console.log(versions.includes(process.env.VERSION) ? 'yes' : 'no');
              }catch{e{console.log('no');process.exit(1)}}
            })
          ")

          if [ "$FOUND" != "yes" ]; then
            echo "::error::Version $PKG_VERSION not found on Packagist" && exit 1
          fi
          echo "Packagist distributes version $PKG_VERSION"

      - name: Verify shadcn registry artifacts are available
        run: |
          # Registry artifacts are served from raw.githubusercontent.com.
          REF="${{ github.event.release.tag_name }}"
          echo "Verifying registry artifacts at ref $REF"

          REGISTRY_URL="https://raw.githubusercontent.com/${{ github.repository }}/$REF/public/r/registry.json"
          ITEM_URL="https://raw.githubusercontent.com/${{ github.repository }}/$REF/public/r/data-table.json"

          HTTP_CODE=$(curl -sSf -o /dev/null -w "%{http_code}" "$REGISTRY_URL")
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Registry artifact not available: $REGISTRY_URL (HTTP $HTTP_CODE)" && exit 1
          fi

          HTTP_CODE=$(curl -sSf -o /dev/null -w "%{http_code}" "$ITEM_URL")
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Registry item artifact not available: $ITEM_URL (HTTP $HTTP_CODE)" && exit 1
          fi

          echo "Registry artifacts available at ref $REF"

      - name: Validate registry JSON and referenced assets
        run: |
          # Validate the checked-out registry.json and confirm referenced
          # artifact files exist and are parseable.
          if [ ! -f registry.json ]; then
            echo "::error::registry.json not found in repository" && exit 1
          fi

          # Validate registry.json is valid JSON.
          node -e "JSON.parse(require('fs').readFileSync('registry.json','utf8'))" \
            || { echo "::error::registry.json is not valid JSON" && exit 1; }

          # Confirm the data-table item references only existing artifact paths.
          node -e "
            const fs=require('fs');
            const reg=JSON.parse(fs.readFileSync('registry.json','utf8'));
            const item=reg.items.find(i=>i.name==='data-table');
            if(!item){console.error('data-table item missing');process.exit(1);}
            const paths=item.files.map(f=>f.path);
            for(const p of paths){
              if(!fs.existsSync(p)){console.error('missing artifact path:',p);process.exit(1);}
            }
            console.log('All',paths.length,'data-table artifact paths exist');
          "

          echo "Registry JSON and referenced assets validated"
