name: Setup PHP
description: Reusable PHP setup for Inertia Datatables CI workflows

inputs:
  php-version:
    description: PHP version to install
    required: true
  extensions:
    description: Comma-separated list of PHP extensions to install
    required: false
    default: "dom, curl, libxml, mbstring, zip, fileinfo, sqlite, pdo_sqlite, bcmath, intl"
  ini-values:
    description: PHP INI values to set
    required: false
    default: "error_reporting=E_ALL"
  coverage:
    description: Coverage driver (none, xdebug, or pcov)
    required: false
    default: "none"
  tools:
    description: Composer tool version to install
    required: false
    default: "composer:v2"

runs:
  using: composite
  steps:
    - name: Setup PHP
      uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
      with:
        php-version: ${{ inputs.php-version }}
        extensions: ${{ inputs.extensions }}
        ini-values: ${{ inputs.ini-values }}
        tools: ${{ inputs.tools }}
        coverage: ${{ inputs.coverage }}
